<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Popeye · Slideshow</title><link rel="stylesheet" href="/style.css"><script src="/zoom.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">POPEYE<span>Photographs, rediscovered.</span></a><div class="collection" id="collection">Your collection · loading</div></header>
<main><div class="stage" id="stage"><img id="photo" alt=""><div class="placeholder" id="placeholder"><span class="eyebrow">A MOMENT FROM YOUR COLLECTION</span><h1>Let your photographs<br>find you.</h1><p id="status" role="status" aria-live="polite">Choosing a photograph…</p></div><button id="fullscreen" class="fullscreen" aria-label="Enter fullscreen">⛶</button></div>
<section class="details"><div><span class="eyebrow" id="date">RANDOM DISCOVERIES</span><h2 id="filename">Your archive, one photograph at a time.</h2><p id="path"></p><p id="camera"></p></div><span class="tag">SHUFFLE ON</span></section></main>
<footer><div class="controls"><button id="play" aria-label="Pause slideshow">Pause</button><button id="back" disabled>Back</button><button id="chronological-previous" disabled>← Previous Image</button><button id="chronological-next" disabled>Next Image →</button><button id="next">Next Random →</button><label for="interval">Every <input id="interval" type="number" min="1" max="3600" value="10"> seconds</label></div><p id="hint" role="status" aria-live="polite">Space to pause · ←/→ chronological · B back · R random · F fullscreen</p></footer>
</body></html>
